name: Apply uploaded patch

# One-off: applies performance-report.patch (and comparison-coverage.patch first, if it is
# still waiting), removes the patch files and the apply workflows, then redeploys.
# Runs when this file or the patch is pushed, whichever lands second, or from the Actions tab.
# If a patch does not apply cleanly, or the tests fail, the job fails and nothing is pushed.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/apply-performance-patch.yml
      - 'performance-report*.patch'

permissions:
  contents: write
  actions: write

concurrency:
  group: apply-performance-patch
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply the patches
        id: apply
        run: |
          set -euo pipefail
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          if ! ls performance-report*.patch >/dev/null 2>&1; then
            echo "::notice::performance-report.patch is not in the repository yet; this run will repeat when it is uploaded."
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The comparison fix first (the report builds on it), then the report. A download
          # saved as "name (1).patch" is accepted; a patch already in the tree is skipped.
          for patch in comparison-coverage*.patch performance-report*.patch; do
            [ -e "$patch" ] || continue
            if git apply --check --reverse "$patch" >/dev/null 2>&1; then
              echo "$patch is already applied; skipping."
            else
              git am --3way "$patch"
            fi
          done
          git rm -q --ignore-unmatch -- comparison-coverage*.patch performance-report*.patch \
            .github/workflows/apply-coverage-patch.yml .github/workflows/apply-performance-patch.yml
          git commit -q -m "Remove the applied patches and the one-off apply workflows"
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Test and build before anything is pushed
        if: steps.apply.outputs.applied == 'true'
        run: |
          npm ci
          npm test
          npm run build

      - name: Push
        if: steps.apply.outputs.applied == 'true'
        run: git push

      - name: Redeploy with the new code
        if: steps.apply.outputs.applied == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker.yml --ref "$GITHUB_REF_NAME"
